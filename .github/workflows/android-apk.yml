
name: Build KolomKhela Android APKs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Inspect generated APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated APKs..."

          if [ ! -d app/build/outputs/apk ]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          find app/build/outputs/apk \
            -type f -name "*.apk" -print

      - name: Prepare ARM64 and ARMv7 APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          ARM64_APK=$(find app/build/outputs/apk \
            -type f -name "*arm64-v8a*.apk" -print -quit)

          ARMV7_APK=$(find app/build/outputs/apk \
            -type f -name "*armeabi-v7a*.apk" -print -quit)

          if [ -z "$ARM64_APK" ]; then
            echo "::error::ARM64 APK not found."
            echo "Check the Gradle output above."
            exit 1
          fi

          if [ -z "$ARMV7_APK" ]; then
            echo "::error::ARMv7 APK not found."
            echo "Check whether CMake compiled armeabi-v7a."
            exit 1
          fi

          cp "$ARM64_APK" dist/KolomKhela-ARM64.apk
          cp "$ARMV7_APK" dist/KolomKhela-ARMv7.apk

          echo "Prepared APKs:"
          ls -lh dist/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: KolomKhela-Android-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
