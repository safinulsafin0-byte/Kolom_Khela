name: Build KolomKhela Android APKs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare ARM64 and ARMv7 APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -type f -name "*.apk" -print
          ARM64_APK=$(find app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -print -quit)
          ARMV7_APK=$(find app/build/outputs/apk -type f -name "*armeabi-v7a*.apk" -print -quit)
          [ -n "$ARM64_APK" ] || { echo "::error::ARM64 APK not found"; exit 1; }
          [ -n "$ARMV7_APK" ] || { echo "::error::ARMv7 APK not found"; exit 1; }
          cp "$ARM64_APK" dist/KolomKhela-ARM64.apk
          cp "$ARMV7_APK" dist/KolomKhela-ARMv7.apk

      - name: Verify libmain.so is inside both APKs
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/*.apk; do
            echo "== $a"
            unzip -l "$a" | grep -E "lib/.*/(libmain|libc\+\+_shared)\.so"
            unzip -l "$a" | grep -q "libmain.so" || { echo "::error::libmain.so missing in $a"; exit 1; }
          done

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: KolomKhela-Android-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
