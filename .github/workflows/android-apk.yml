
name: Build Android APKs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------
      # Build ARM64 APK
      # -------------------------------------------------
      - name: Build ARM64 APK
        run: |
          gradle --no-daemon :app:assembleDebug \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Save ARM64 APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/KolomKhela-ARM64.apk

      # -------------------------------------------------
      # Build ARMv7 APK
      # -------------------------------------------------
      - name: Build ARMv7 APK
        run: |
          gradle --no-daemon :app:assembleDebug \
            -Pandroid.injected.build.abi=armeabi-v7a

      - name: Save ARMv7 APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/KolomKhela-ARMv7.apk

      # -------------------------------------------------
      # Upload both APKs
      # -------------------------------------------------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KolomKhela-Android-APKs
          path: dist/*.apk
          if-no-files-found: error
