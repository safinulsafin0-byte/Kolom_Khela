
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.safinul.kolomkhela'
    compileSdk 35

    defaultConfig {
        applicationId 'com.safinul.kolomkhela'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
