plugins {
    id 'com.android.application'
}

android {
    namespace 'com.safinul.kolomkhela'
    compileSdk 35

    // Must match the NDK installed in the GitHub workflow (ndk;27.2.12479018)
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.safinul.kolomkhela'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '1.2'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    // One APK per architecture (arm64-v8a + armeabi-v7a).
    // Do not add ndk.abiFilters when using ABI splits.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
