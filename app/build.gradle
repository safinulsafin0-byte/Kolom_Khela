
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.safinul.kolomkhela'
    compileSdk 35

    defaultConfig {
        applicationId 'com.safinul.kolomkhela'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1'

        // Build APKs for both 64-bit and 32-bit ARM Android devices.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Build separate APKs for each ABI.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
