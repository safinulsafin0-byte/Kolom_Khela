plugins {
    id 'com.android.application'
}

android {
    namespace 'com.safinul.kolomkhela'
    compileSdk 35

    defaultConfig {
        applicationId 'com.safinul.kolomkhela'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Use the existing root CMakeLists.txt; game source is unchanged.
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
